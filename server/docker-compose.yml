# Selah group/church sync on the unmanaged VPS.
# Containers: selah-api, selah-postgres (optional caddy).
# Publishes API only on 127.0.0.1:8091 by default — does not take 3000 or 5432.

services:
  selah-postgres:
    image: postgres:16-alpine
    container_name: selah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-selah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-selah}
    volumes:
      - selah-postgres-data:/var/lib/postgresql/data
    # No host ports — mcda already uses host 5432.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - selah-network

  selah-api:
    build: .
    container_name: selah-api
    restart: unless-stopped
    depends_on:
      selah-postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: selah-postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-selah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-selah}
      TOKEN_SECRET: ${TOKEN_SECRET:?set TOKEN_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://selah.psithurismlabs.com}
      PORT: '8080'
    ports:
      - '127.0.0.1:${SELAH_API_HOST_PORT:-8091}:8080'
    networks:
      - selah-network
      # Shared with son-caddy so HTTPS can reach this API by container name.
      - son_default

volumes:
  selah-postgres-data:
    name: selah-postgres-data

networks:
  selah-network:
    name: selah-network
    driver: bridge
  # Existing Caddy stack on this VPS (/opt/son/deploy/Caddyfile).
  son_default:
    external: true
