# Selah group/church sync on the unmanaged VPS.
# Containers: selah-api, selah-postgres (optional caddy).
# Publishes API only on 127.0.0.1:8091 by default — does not take 3000 or 5432.

services:
  selah-postgres:
    image: postgres:16-alpine
    container_name: selah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-selah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-selah}
    volumes:
      - selah-postgres-data:/var/lib/postgresql/data
    # No host ports — mcda already uses host 5432.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - selah-network

  selah-api:
    build: .
    container_name: selah-api
    restart: unless-stopped
    depends_on:
      selah-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-selah}:${POSTGRES_PASSWORD}@selah-postgres:5432/${POSTGRES_DB:-selah}
      TOKEN_SECRET: ${TOKEN_SECRET:?set TOKEN_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://selah.psithurismlabs.com}
      PORT: '8080'
    ports:
      - '127.0.0.1:${SELAH_API_HOST_PORT:-8091}:8080'
    networks:
      - selah-network

  # Include only when host ports 80/443 are free.
  # If another proxy already binds them, skip this service and forward
  # selah.psithurismlabs.com to 127.0.0.1:8091 on that proxy instead.
  # selah-caddy:
  #   image: caddy:2-alpine
  #   container_name: selah-caddy
  #   restart: unless-stopped
  #   ports:
  #     - '80:80'
  #     - '443:443'
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - selah-caddy-data:/data
  #     - selah-caddy-config:/config
  #   depends_on:
  #     - selah-api
  #   networks:
  #     - selah-network

volumes:
  selah-postgres-data:
    name: selah-postgres-data
  # selah-caddy-data:
  #   name: selah-caddy-data
  # selah-caddy-config:
  #   name: selah-caddy-config

networks:
  selah-network:
    name: selah-network
    driver: bridge
